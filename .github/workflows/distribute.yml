name: Distribute to TestFlight

on:
  push:
    branches: [main]
  # A push to main is the only thing that ships. This exists so the pipeline can be PROVEN
  # without shipping — dry_run archives and exports but skips the upload. #30's "Done when"
  # asks for one real run, and there was previously no way to have one.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Archive and export, but do not upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 16.2 was pinned here and CANNOT build this project. It exists on macos-15, so
          # xcode-select succeeds and the failure surfaces later as an opaque SwiftPM manifest
          # error. That was because ComposableArchitecture and swift-sharing declared
          # swift-tools-version: 6.1, needing Swift 6.1 — Xcode 16.3 at minimum. #20 removed
          # every package, so that specific failure is gone.
          #
          # **26.3 replaced it and was in turn the reason 3.0.0 build 23 was thrown out.** The
          # pin was justified as "newest on macos-15, closest to the local toolchain", and that
          # was true and is exactly the trap: an Xcode old enough to be *rejected by the App
          # Store* still builds, archives, signs and uploads without complaint. The rejection
          # arrives afterwards as ITMS-90111, against a build number you can never reuse.
          #
          # The lesson is that this pin has two floors, not one. It must be new enough to compile
          # the project, and new enough for Apple to accept the upload — and the second floor
          # moves on Apple's schedule, not the project's. Both are asserted in the next step.
          # macos-15 tops out at 26.3, so satisfying the second one meant moving the image too.
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Assert the toolchain can build this project and ship it
        run: |
          # Fail here, with a reason, rather than minutes later inside the archive.
          #
          # **The floor is no longer a package constraint, and this no longer says it is.**
          # ComposableArchitecture and swift-sharing declared swift-tools-version 6.1, so an older
          # Xcode failed during resolution with an error that never mentioned Xcode. #20 removed
          # every package. A guard that blames a dependency the project does not have sends whoever
          # trips it looking for a Package.resolved that is not there.
          SWIFT_VERSION=$(swift -version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          REQUIRED=6.1
          if [ "$(printf '%s\n%s' "$REQUIRED" "$SWIFT_VERSION" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "::error::Swift $SWIFT_VERSION is older than the $REQUIRED this project builds against."
            echo "::error::Pick a newer Xcode in the Select Xcode step."
            exit 1
          fi
          echo "Swift $SWIFT_VERSION satisfies the $REQUIRED floor."

          # **The second floor, and the only one that has actually rejected a release.** The check
          # above asks whether the toolchain can compile this project. Apple asks a different
          # question — whether the SDK is recent enough for the App Store to accept the upload at
          # all — and answers it *after* the archive, the signing, the upload and the submission.
          # 3.0.0 build 23 cleared every step of this pipeline on Xcode 26.3 and was then thrown
          # out by automated validation with ITMS-90111, which costs a burnt build number and a
          # round trip through App Store Connect to discover. This makes it cost ten seconds.
          #
          # **This number is not derived from anything in the repo — it tracks Apple.** Raise it
          # when Apple raises the floor, which is announced at developer.apple.com/news/releases
          # and is typically the newest stable Xcode. Bumping it may also require a newer
          # `runs-on` image, because an image only carries so many Xcodes.
          XCODE_VERSION=$(xcodebuild -version | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          REQUIRED_XCODE=26.6
          if [ "$(printf '%s\n%s' "$REQUIRED_XCODE" "$XCODE_VERSION" | sort -V | head -1)" != "$REQUIRED_XCODE" ]; then
            echo "::error::Xcode $XCODE_VERSION is below the $REQUIRED_XCODE the App Store currently accepts."
            echo "::error::This builds and uploads fine, then fails validation with ITMS-90111 and burns the build number."
            echo "::error::Raise it in the Select Xcode step — and the runs-on image, if that image has nothing newer."
            exit 1
          fi
          echo "Xcode $XCODE_VERSION satisfies the $REQUIRED_XCODE App Store floor."

      - name: Assert the release notes belong to this release
        run: |
          # **The quiet failure this closes.** "Read What's New" below fell back to a placeholder
          # when RELEASE_NOTES.md had no section for the version — a warning in a log nobody reads,
          # and testers get "see the commit history". Failing the run costs a re-push; shipping
          # filler costs the one thing a TestFlight build is for.
          #
          # It cannot check the harder case — a section that exists and describes a *different*
          # release, which is what was sitting in this repo when the dial epic was ready to
          # promote. Nothing automatic can. This checks the half that can be checked.
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" SonicPlayer/Info.plist)
          if ! grep -qx "## $VERSION" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## $VERSION' section."
            echo "::error::Add one before bumping CFBundleShortVersionString — testers read it as What's New."
            exit 1
          fi
          echo "Found the $VERSION section."

      - name: Assert the version lives in exactly one place
        run: |
          # **The trap this closes.** The app target sets GENERATE_INFOPLIST_FILE = NO and
          # INFOPLIST_FILE = SonicPlayer/Info.plist, so the plist's literal values are what ship,
          # and every step here reads them with PlistBuddy. But the target also carried
          # MARKETING_VERSION = 2.3.0 and CURRENT_PROJECT_VERSION = 16 — left over, read by
          # nothing, and four versions behind what was actually on the App Store.
          #
          # That matters because Xcode's General tab writes *those* settings. Bump the version
          # in the UI and it edits a dead key: the field reads 3.0.1, the build ships 3.0.0, and
          # nothing anywhere disagrees out loud. Deleting them empties the field, which is a
          # better signal than a wrong number — but typing into it puts the key straight back.
          #
          # So the rule, not the instance: the keys may be absent, or they may agree. They may
          # not silently disagree.
          # **Every plist read goes through this, and the `|| true` is the whole point.**
          # PlistBuddy exits 1 on a missing key, GitHub runs this block as `bash -e {0}`, and the
          # exit status of `VAR=$(cmd)` is cmd's — so a missing key killed the step at the
          # assignment, before any of the hand-written `::error::` lines below could explain it.
          # That is the same defect fixed for xcodebuild a few lines down, which was reintroduced
          # here by not applying the rule to every command that can fail.
          plist_get() {
            /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true
          }

          require_key() {   # value, plist, key
            if [ -z "$1" ]; then
              echo "::error::$2 has no :$3, so the version check could not run."
              echo "::error::Treating that as a failure rather than a pass."
              exit 1
            fi
          }

          VERSION=$(plist_get SonicPlayer/Info.plist CFBundleShortVersionString)
          BUILD=$(plist_get SonicPlayer/Info.plist CFBundleVersion)
          require_key "$VERSION" SonicPlayer/Info.plist CFBundleShortVersionString
          require_key "$BUILD"   SonicPlayer/Info.plist CFBundleVersion

          # Ask Xcode for the app target's *resolved* settings rather than grepping the pbxproj.
          # The two targets' config blocks are textually identical apart from the bundle id, and
          # the test bundle's own MARKETING_VERSION = 1.0 is live and correct — it generates its
          # plist. Any line-window grep that tries to tell them apart is a guess; this is not.
          # `|| true` is load-bearing, and its absence disabled the guard below.
          #
          # GitHub runs each `run:` block as `bash -e {0}`. The exit status of `VAR=$(cmd)` is
          # cmd's, so a failing xcodebuild killed the step *here* — before the hand-written
          # "could not read the build settings" error could print — and `2>/dev/null` had already
          # discarded xcodebuild's own diagnosis. The result was a red step with no annotation and
          # no output: precisely the silent failure the next twelve lines exist to prevent.
          SETTINGS=$(xcodebuild -project SonicPlayer.xcodeproj -target SonicPlayer \
            -configuration Release -showBuildSettings 2>&1) || true

          # If that call fails its output is empty, every key reads as "unset", and the check
          # below passes having verified nothing — a guard that cannot fail, which is the shape
          # this step exists to remove. Prove the output is real before trusting an absence.
          if ! printf '%s\n' "$SETTINGS" | grep -q '^ *PRODUCT_BUNDLE_IDENTIFIER = com.hasan.sonicplayer$'; then
            echo "::error::Could not read the app target's build settings, so the version check"
            echo "::error::could not run. Treating that as a failure rather than a pass."
            exit 1
          fi

          for pair in "MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD"; do
            key=${pair%%=*}
            expected=${pair#*=}
            found=$(printf '%s\n' "$SETTINGS" | sed -n "s/^ *$key = //p")
            if [ -z "$found" ]; then
              echo "$key is unset on the app target — Info.plist is unopposed."
            elif [ "$found" != "$expected" ]; then
              echo "::error::The app target sets $key = $found, but Info.plist ships $expected."
              echo "::error::Xcode's General tab writes $key and this build ignores it."
              echo "::error::Delete the key from the app target, or make it match Info.plist."
              exit 1
            else
              echo "$key = $found agrees with Info.plist."
            fi
          done

          # **The share extension makes "exactly one place" literally false, and that is why this
          # half exists.** SonicPlayerShare is an embedded bundle with its own Info.plist, and
          # App Store Connect REJECTS an upload whose extension disagrees with its host. There is
          # no build setting that can remove the duplication — $(MARKETING_VERSION) is exactly the
          # key the block above exists to keep deleted — so the second copy is literal and checked
          # here instead of merely intended.
          #
          # The cost of not checking is the expensive kind: the disagreement surfaces after the
          # archive, after the signing, after the upload, against a build number that can never be
          # reused. That is the shape of the ITMS-90111 rejection that burned 3.0.0 (23).
          EXT_PLIST=SonicPlayerShare/Info.plist
          if [ ! -f "$EXT_PLIST" ]; then
            echo "::error::$EXT_PLIST is missing, so the extension's version could not be checked."
            echo "::error::Treating that as a failure rather than a pass."
            exit 1
          fi

          EXT_VERSION=$(plist_get "$EXT_PLIST" CFBundleShortVersionString)
          EXT_BUILD=$(plist_get "$EXT_PLIST" CFBundleVersion)
          require_key "$EXT_VERSION" "$EXT_PLIST" CFBundleShortVersionString
          require_key "$EXT_BUILD"   "$EXT_PLIST" CFBundleVersion

          if [ "$EXT_VERSION" != "$VERSION" ] || [ "$EXT_BUILD" != "$BUILD" ]; then
            echo "::error::SonicPlayerShare ships $EXT_VERSION ($EXT_BUILD); the app ships $VERSION ($BUILD)."
            echo "::error::App Store Connect rejects an upload whose embedded extension disagrees"
            echo "::error::with its host. Update $EXT_PLIST to match SonicPlayer/Info.plist."
            exit 1
          fi
          echo "SonicPlayerShare $EXT_VERSION ($EXT_BUILD) agrees with the app."

          # The extension target gets the same treatment as the app target above, for the same
          # reason: Xcode's General tab writes MARKETING_VERSION on whichever target is selected,
          # and a stale key on the extension is exactly as invisible as it was on the app.
          EXT_SETTINGS=$(xcodebuild -project SonicPlayer.xcodeproj -target SonicPlayerShare \
            -configuration Release -showBuildSettings 2>&1) || true

          if ! printf '%s\n' "$EXT_SETTINGS" | grep -q '^ *PRODUCT_BUNDLE_IDENTIFIER = com.hasan.sonicplayer.share$'; then
            echo "::error::Could not read SonicPlayerShare's build settings, so its version check"
            echo "::error::could not run. Treating that as a failure rather than a pass."
            exit 1
          fi

          for pair in "MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD"; do
            key=${pair%%=*}
            expected=${pair#*=}
            found=$(printf '%s\n' "$EXT_SETTINGS" | sed -n "s/^ *$key = //p")
            if [ -z "$found" ]; then
              echo "$key is unset on SonicPlayerShare — its Info.plist is unopposed."
            elif [ "$found" != "$expected" ]; then
              echo "::error::SonicPlayerShare sets $key = $found, but its Info.plist ships $expected."
              echo "::error::Delete the key from the extension target, or make it match."
              exit 1
            else
              echo "$key = $found agrees with the extension's Info.plist."
            fi
          done

          echo "Version $VERSION ($BUILD) is consistent across the app and SonicPlayerShare."

      - name: Refuse to ship a share extension that does nothing (#112)
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          # **The only hazard in #112 whose cost lands on a person rather than on a build number.**
          #
          # SonicPlayerShare is a real, registered com.apple.share-services extension: Sonic Player
          # is offered for any audio file from the moment the app installs. While slice 1 sits on
          # `feat` that reaches nobody. The instant it reaches `main` it reaches TestFlight, and a
          # tester who shares a voice memo is offered Sonic Player, taps it, and is told the feature
          # is not wired up — in English, in all nine locales.
          #
          # That was guarded by a sentence in a doc comment, in the same branch that bumped
          # CFBundleVersion to 26. This repo's standard is "checked rather than trusted" — the
          # two-plist guard exists for a strictly cheaper failure than this one.
          #
          # Deliberately runs ONLY when the run would really upload, so dry runs stay useful for
          # proving signing while the extension is still a stub. That is the whole workflow this
          # slice was built around.
          MARKER=SHARE-EXTENSION-STUB
          FILE=SonicPlayerShare/ShareViewController.swift

          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing, so the stub check could not run."
            echo "::error::Treating that as a failure rather than a pass."
            exit 1
          fi

          if grep -q "$MARKER" "$FILE"; then
            echo "::error::SonicPlayerShare is still the slice 1 stub and this run would upload it."
            echo "::error::Testers would be offered a share extension that says it does not work."
            echo "::error::Land slice 2 of #112 first, then delete the $MARKER line from $FILE."
            exit 1
          fi
          echo "Share extension is past the slice 1 stub — safe to upload."

      # **`Install signing certificate` and `Install provisioning profile` stood here.**
      #
      # They imported a base64 `.p12` into a throwaway keychain and dropped a `.mobileprovision`
      # into place — four secrets between them, all of which had to be re-exported by hand every
      # time a certificate expired or the profile drifted from the bundle ID.
      #
      # None of that is needed to sign. `-allowProvisioningUpdates` plus an App Store Connect API
      # key lets the runner fetch or create its own signing assets, which is exactly what Xcode does
      # locally under automatic signing — and automatic signing is what this project already uses,
      # so the old path was asking for artifacts that were never produced in the first place. The
      # machine that shipped build 23 by hand holds only an `Apple Development` identity; there was
      # no distribution `.p12` to export.
      #
      # Seven secrets become three, and the three come from one key.

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          # **Before the archive, not after.** It used to sit between `Archive` and `Export`, which
          # was fine while the archive signed itself from an imported certificate. Signing assets
          # are now fetched with this key, so the archive needs it too.
          #
          # **Everything below the write is here because the silent version cost two runs.**
          # `base64 --decode` of an empty secret writes an empty file and exits 0, so this step goes
          # green on a secret that does not exist. The failure then lands in `Archive` as
          #
          #   xcodebuild: error: Invalid authentication key credential specified
          #   (CryptoKit.CryptoKitASN1Error.invalidPEMDocument).
          #
          # which names neither the secret, nor this step, nor the fact that a file is empty. That
          # is the whole defect: a write that cannot fail, feeding a reader that cannot explain.
          # These checks cost about a second and name the thing that is actually wrong.
          for var in ASC_API_KEY ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is empty or unset."
              echo "::error::Set it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done

          # `ASC_API_KEY_ID` is interpolated into the filename that `Archive` and `Export` read back
          # by the same expression. Empty, it yields `AuthKey_.p8` on both sides — consistent, so
          # nothing notices until Apple rejects the credential.
          mkdir -p $RUNNER_TEMP/private_keys
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo -n "$ASC_API_KEY" | base64 --decode -o "$KEY_PATH"

          # Parses the decoded bytes as a private key rather than merely checking the file is
          # non-empty — base64 of the wrong file decodes perfectly and is still not a key.
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::ASC_API_KEY did not decode to a private key."
            echo "::error::It must be the base64 of the .p8 issued by App Store Connect:"
            echo "::error::  base64 -i AuthKey_${ASC_API_KEY_ID}.p8 | gh secret set ASC_API_KEY"
            exit 1
          fi
          echo "Key $ASC_API_KEY_ID decoded and parsed as a private key."

      # `Resolve packages` stood here and is gone with #20. `Package.resolved` pins zero packages,
      # so the step resolved nothing — and a resolution step in a release pipeline is a standing
      # claim that this project has dependencies to resolve.

      - name: Archive
        run: |
          xcodebuild archive \
            -project SonicPlayer.xcodeproj \
            -scheme SonicPlayer \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/SonicPlayer.xcarchive \
            -configuration Release \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Read What's New
        run: |
          # Previously derived from merge-commit bodies since the nearest tag. That produced PR
          # titles ("give the five clients .live/.test independent of swift-dependencies") and
          # the tag baseline was unreliable — this repo's newest tag is v1.1.1 while the app is
          # at 2.3.0, so the range would have spanned four major versions. Notes now come from a
          # file someone wrote for testers.
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" SonicPlayer/Info.plist)

          NOTES=$(awk -v v="## $VERSION" '
            $0 == v { grab = 1; next }
            /^## / && grab { exit }
            grab { print }
          ' RELEASE_NOTES.md | sed '/^$/d')

          if [ -z "$NOTES" ]; then
            # Unreachable from the heading check above, which stops the run first. Kept for the one
            # case it cannot see: a heading that exists with nothing underneath it.
            echo "::error::The '## $VERSION' section in RELEASE_NOTES.md is empty."
            exit 1
          fi

          echo "$NOTES" > $RUNNER_TEMP/whats_new.txt
          echo "What's New for $VERSION:"
          cat $RUNNER_TEMP/whats_new.txt

      - name: Export, and upload unless this is a dry run
        run: |
          # **This step no longer skips on a dry run, and that is the fix.**
          #
          # It was gated `push || !dry_run`, so a dry run archived and stopped. Both this file's
          # header and `docs/deploy-and-staging.md` claimed it "archives, exports and validates,
          # then stops before the upload" — it did not export, and export is where signing happens.
          # So the one facility for proving the pipeline without shipping could not prove the part
          # most likely to be broken. Now the step always runs and only its DESTINATION changes.
          DESTINATION=upload
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DESTINATION=export
            echo "Dry run: exporting a signed .ipa to disk, not uploading."
          fi

          # **Read from the project rather than a secret.** The team id is not a credential — it is
          # committed in project.pbxproj, and it is what the app is actually signed with. Holding a
          # second copy in `secrets.TEAM_ID` created a value that could silently disagree with the
          # one in the build, and cost a secret to store something already public.
          TEAM_ID=$(grep -m1 'DEVELOPMENT_TEAM' SonicPlayer.xcodeproj/project.pbxproj | tr -d ' \t;' | cut -d= -f2)
          if [ -z "$TEAM_ID" ]; then
            echo "::error::No DEVELOPMENT_TEAM in project.pbxproj — cannot export."
            exit 1
          fi
          echo "Team: $TEAM_ID, destination: $DESTINATION"

          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>$DESTINATION</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SonicPlayer.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/Export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Set What's New in TestFlight
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          WHATS_NEW=$(cat $RUNNER_TEMP/whats_new.txt)
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

          # Generate JWT
          NOW=$(date +%s)
          EXP=$((NOW + 1200))
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_API_KEY_ID" | base64 | tr -d '=\n' | tr '/+' '_-')
          PAYLOAD=$(printf '{"iss":"%s","exp":%d,"aud":"appstoreconnect-v1"}' "$ASC_API_ISSUER_ID" "$EXP" | base64 | tr -d '=\n' | tr '/+' '_-')
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign "$KEY_PATH" | base64 | tr -d '=\n' | tr '/+' '_-')
          JWT="$HEADER.$PAYLOAD.$SIGNATURE"

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" SonicPlayer/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" SonicPlayer/Info.plist)

          # **-g on every call, and it is not optional.** curl reads [ and ] as URL GLOBBING
          # metacharacters, so `filter[version]=` is a malformed range expression: it refuses the
          # URL without making a request and exits 3. That happens inside `RESPONSE=$(...)` under
          # `bash -e`, so the step died in 210ms having printed one line and no retries. Build
          # 3.0.0 (24) uploaded fine and shipped with no What's New because of this.
          #
          # **No dry run can catch it**, which is why it survived: this step is gated on
          # `push || !dry_run`, so every dry run skips the one step that talks to the API. The
          # facility for proving the pipeline cannot reach it. Change anything here and the only
          # real test is the next release.
          api() { curl -gsS -H "Authorization: Bearer $JWT" "$@"; }

          # **filter[app] takes the numeric app id, never the bundle id.** It was
          # `filter[app]=com.hasan.sonicplayer`, which matches nothing — so even once the URL
          # parsed, the loop would have timed out and exited 0, reporting success having set
          # nothing. Two bugs deep, the second one green.
          APP_ID=$(api "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.hasan.sonicplayer" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])" 2>/dev/null || echo "")

          if [ -z "$APP_ID" ]; then
            echo "::error::Could not resolve the app id for com.hasan.sonicplayer."
            echo "The build IS uploaded — this failure is about What's New only."
            exit 1
          fi
          echo "App id: $APP_ID"

          # Wait for build to finish processing
          echo "Waiting for build $VERSION ($BUILD) to finish processing..."
          for i in $(seq 1 30); do
            RESPONSE=$(api "https://api.appstoreconnect.apple.com/v1/builds?filter[version]=$BUILD&filter[preReleaseVersion.version]=$VERSION&filter[app]=$APP_ID")

            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['attributes']['processingState'])" 2>/dev/null || echo "WAITING")

            if [ "$STATUS" = "VALID" ]; then
              BUILD_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])")
              echo "Build processed. ID: $BUILD_ID"
              break
            fi
            echo "  Status: $STATUS — retrying in 30s ($i/30)"
            sleep 30
          done

          # **A timeout here is NOT the same as a broken call, and they must not report alike.**
          # The upload has already succeeded by this point; Apple simply has not finished
          # processing within 15 minutes, which is ordinary. Failing the run would report a
          # successful release as a failed one. So: warn loudly, say what to do by hand, exit 0 —
          # while a call that cannot work at all fails above, where it belongs.
          if [ -z "${BUILD_ID:-}" ]; then
            echo "::warning::Build $VERSION ($BUILD) is uploaded but still processing after 15 minutes."
            echo "What's New was NOT set. Set it in App Store Connect > TestFlight, or re-run this workflow once processing finishes."
            exit 0
          fi

          # Set What's New via beta build localizations
          WHATS_NEW_JSON=$(echo "$WHATS_NEW" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().strip()))')

          LOC_RESPONSE=$(api "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID/betaBuildLocalizations")

          LOC_ID=$(echo "$LOC_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])" 2>/dev/null || echo "")

          if [ -n "$LOC_ID" ]; then
            api -X PATCH -H "Content-Type: application/json" \
              "https://api.appstoreconnect.apple.com/v1/betaBuildLocalizations/$LOC_ID" \
              -d "{\"data\":{\"type\":\"betaBuildLocalizations\",\"id\":\"$LOC_ID\",\"attributes\":{\"whatsNew\":$WHATS_NEW_JSON}}}"
          else
            api -X POST -H "Content-Type: application/json" \
              "https://api.appstoreconnect.apple.com/v1/betaBuildLocalizations" \
              -d "{\"data\":{\"type\":\"betaBuildLocalizations\",\"attributes\":{\"locale\":\"en-US\",\"whatsNew\":$WHATS_NEW_JSON},\"relationships\":{\"build\":{\"data\":{\"type\":\"builds\",\"id\":\"$BUILD_ID\"}}}}}"
          fi

          echo "What's New set for build $VERSION ($BUILD)"

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run: archived, SIGNED and exported. Nothing uploaded."
          ls -la $RUNNER_TEMP/Export
          echo "Re-run with dry_run unchecked, or push to main, to ship."

      # `Clean up keychain` stood here, deleting the throwaway keychain the certificate import
      # created. No certificate is imported now, so there is no keychain — and a cleanup step for a
      # thing that is never created reads as a safeguard rather than as dead code, which is how it
      # would have survived the next reading of this file.

      - name: Upload the exported build as an artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: SonicPlayer-dry-run-ipa
          path: ${{ runner.temp }}/Export
          retention-days: 7
          if-no-files-found: error
